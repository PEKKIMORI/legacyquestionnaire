# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # Firebase web config values are public client-side identifiers (they ship in
  # the browser bundle), so they're stored as plaintext with BUILD availability
  # rather than as secrets — the build needs them at module load to call
  # initializeApp() while pre-rendering pages.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB-saN-elh1TmTOOxHOuQ5JDZtVos9oFHI
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: legacyquestionnaire-minerva.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: legacyquestionnaire-minerva
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: legacyquestionnaire-minerva.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "419708047516"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:419708047516:web:05ab0de1c5a1c4ae5c5d59"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-WVD6VRW1RH"
    availability:
      - BUILD
      - RUNTIME

  # Admin allowlist for the /super-secret page's export + allocation APIs.
  # Comma-separated Minerva emails, compared case-insensitively against the
  # signed-in user's verified Firebase ID token (see src/utils/verifyAdmin.ts).
  # Not a secret — these are just identities; edit the list + roll out to change
  # who has admin access.
  - variable: ADMIN_EMAILS
    value: "bo@uni.minerva.edu,branden@minerva.edu,karolina@uni.minerva.edu,nokchi1@uni.minerva.edu,rafael.belmonte@uni.minerva.edu"
    availability:
      - RUNTIME
